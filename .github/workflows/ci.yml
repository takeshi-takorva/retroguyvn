name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build Astro site
        run: npm run build
      - name: Inspect built admin assets
        run: |
          echo "=== dist/client admin paths · post-prerender-probe-final ==="
          find dist/client -maxdepth 5 -type f -printf '%p %s bytes\n' | sort | grep -E 'admin|ota' || true
          echo "=== zero-byte files ==="
          find dist/client -type f -size 0 -printf '%p\n' | sort || true
      - name: Probe production OTA admin
        run: |
          node - <<'NODE'
          const stamp = Date.now();
          const targets = [
            'https://retroguyvn.com/admin/ota',
            'https://retroguyvn.com/admin/ota/',
            'https://retroguyvn.com/admin/ota/index.html',
            `https://retroguyvn.com/admin/ota?__dr_probe=${stamp}`,
            'https://retroguyvn.com/admin',
            'https://retroguyvn.com/admin/pages/',
            'https://retroguyvn.com/admin/system',
            'https://retroguyvn.com/admin/devlog',
            'https://retroguyvn.com/admin/products',
            'https://retroguyvn.doanducviet5488.workers.dev/admin/ota',
            'https://retroguyvn.com/admin-ota-file-actions.js'
          ];
          for (const url of targets) {
            const response = await fetch(url, {
              redirect: 'manual',
              headers: { 'user-agent': 'DR-OTA-PROD-PROBE/1.0', 'cache-control': 'no-cache' }
            });
            const text = await response.text();
            console.log('URL', url);
            console.log('STATUS', response.status);
            console.log('CONTENT_TYPE', response.headers.get('content-type'));
            console.log('CACHE_CONTROL', response.headers.get('cache-control'));
            console.log('CF_CACHE_STATUS', response.headers.get('cf-cache-status'));
            console.log('AGE', response.headers.get('age'));
            console.log('CONTENT_LENGTH', response.headers.get('content-length'));
            console.log('SERVER', response.headers.get('server'));
            console.log('CF_RAY', response.headers.get('cf-ray'));
            console.log('BODY_LENGTH', text.length);
            console.log('BODY_HEAD', JSON.stringify(text.slice(0, 300)));
            if (url.includes('/admin/ota')) {
              if (response.status !== 200) throw new Error('admin/ota status ' + response.status);
              if (!text.includes('DR Portal OTA')) console.log('ADMIN_HTML_MISSING', url);
            }
            if (url.endsWith('admin-ota-file-actions.js')) {
              if (response.status !== 200) throw new Error('admin asset status ' + response.status);
            }
          }
          NODE
